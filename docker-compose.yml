# Frontend for local runs. Start the Supabase stack first (npx supabase start);
# see LOCAL_SETUP.md.
services:
  web:
    build:
      context: .
      args:
        # The browser calls Supabase directly, so this is the host's address for the
        # local stack. The key is the standard local-stack anon key.
        # Override names are LOCAL_*-prefixed on purpose: Compose interpolates
        # ${VAR} from the repo .env, which holds the HOSTED project values, so
        # ${VITE_SUPABASE_URL:-...} would silently build against production.
        VITE_SUPABASE_URL: ${LOCAL_SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${LOCAL_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
        VITE_SUPABASE_PROJECT_ID: ${LOCAL_SUPABASE_PROJECT_ID:-local}
    ports:
      - "8080:80"
    restart: unless-stopped
