# JWT Authentication Configuration
# ---------------------------------
# Functions are grouped by their authentication requirements:
# 
# 1. AUTHENTICATED (verify_jwt = true) - Gateway verifies JWT, code does additional validation
#    These functions have both gateway JWT verification AND in-code auth checks for defense-in-depth.
#
# 2. UNAUTHENTICATED (verify_jwt = false) - Auth handled entirely in code or not required
#    - System/cron functions (no user context)
#    - Special auth flows (PIN-based child accounts)
#    - Public endpoints (error collector, health checks)

# ============================================
# AUTHENTICATED FUNCTIONS (verify_jwt = true)
# Gateway JWT verification + in-code auth validation
# ============================================

[functions.create-test-family]
# Admin only - uses validateAdminJWT in code
verify_jwt = true

[functions.create-child-account]
# Parent auth required - uses validateJWT in code
verify_jwt = true

[functions.admin-delete-user]
# Admin only - uses validateAdminJWT in code
verify_jwt = true

[functions.admin-update-user]
# Admin only - uses validateJWT + admin check in code
verify_jwt = true

[functions.delete-family-comprehensive]
# Admin only - uses validateAdminJWT in code
verify_jwt = true

[functions.security-testing]
# Admin only - uses validateAdminJWT, has unauthenticated /health endpoint
verify_jwt = false

[functions.security-monitoring]
# Admin only - uses validateAdminJWT, has unauthenticated /health endpoint
verify_jwt = false

[functions.text-to-speech]
# Supports anonymous access with tiered rate limiting in code
# Authenticated users get higher limits, anonymous users get restricted limits
verify_jwt = false

[functions.api-integration-status]
# User auth required - uses validateJWT in code
verify_jwt = true

[functions.grok-chat]
# Supports anonymous access with tiered rate limiting in code
# Authenticated users get higher limits, anonymous users get restricted limits
verify_jwt = false

[functions.send-family-email]
# User auth required - uses validateJWT in code
verify_jwt = true

[functions.admin-create-user]
# Admin only - uses validateJWT + admin check in code
verify_jwt = true

[functions.admin-add-family-member]
# Admin only - uses validateJWT + admin check in code
verify_jwt = true

[functions.admin-remove-family-member]
# Admin only - uses validateJWT + admin check in code
verify_jwt = true

[functions.cleanup-test-families]
# Admin only - uses validateAdminJWT in code
verify_jwt = true

[functions.update-site-settings]
# User auth required - uses validateJWT in code
verify_jwt = true

[functions.manage-llm-provider]
# User auth required - uses validateJWT in code
verify_jwt = true

[functions.supabase-analytics-query]
# Admin only - uses validateAdminJWT in code (SECURED - previously missing auth)
verify_jwt = true

[functions.llm-with-failover]
# User auth required - uses validateJWT in code (SECURED - previously missing auth)
# Has unauthenticated /health endpoint for monitoring
verify_jwt = false

[functions.family-integrity-check]
# Admin only for actions, runs integrity checks - uses validateAdminJWT in code
verify_jwt = true

# ============================================
# UNAUTHENTICATED FUNCTIONS (verify_jwt = false)
# These functions intentionally skip gateway JWT verification
# ============================================

[functions.complete-child-account]
# Child account completion - uses PIN-based auth, not JWT
# Auth handled entirely in code with PIN verification and lockout logic
verify_jwt = false

[functions.scheduled-health-check]
# System cron job - no user context, called by scheduler
verify_jwt = false

[functions.edge-function-health-check]
# System cron job - no user context, called by scheduler
verify_jwt = false

[functions.process-recurring-chores]
# System cron job - no user context, called by scheduler
verify_jwt = false

[functions.data-health-alerter]
# System cron job - alerting function, called by scheduler
verify_jwt = false

[functions.error-collector]
# Public endpoint - client error reporting (rate-limited, no sensitive data)
verify_jwt = false

[functions.ai-chat]
# AI chat with tiered rate limiting - JWT validated in code
verify_jwt = false

[functions.ai-assessment-review]
# Assessment AI review - public access, no JWT required
verify_jwt = false

[functions.generate-daily-plan]
# AI daily plan generation - requires user JWT
verify_jwt = true

[functions.manage-skill-plan]
# Skill plan CRUD + approval workflow - JWT validated in code
verify_jwt = false

[functions.ai-session-helper]
# AI session helper for kid activities - requires user JWT
verify_jwt = true
