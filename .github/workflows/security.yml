name: Security & Performance Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Run npm security audit
      run: |
        npm audit --audit-level=moderate
        echo "npm-audit-results=$(npm audit --json)" >> $GITHUB_OUTPUT
      
    - name: Install Snyk
      run: npm install -g snyk
      
    - name: Run Snyk security scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        if [ -n "$SNYK_TOKEN" ]; then
          snyk auth $SNYK_TOKEN
          snyk test --severity-threshold=medium
        else
          echo "Snyk token not configured"
        fi
      
    - name: Build project
      run: npm run build
      
    - name: TypeScript check
      run: npm run typecheck
      
    - name: Lint code
      run: npm run lint
      
    - name: Analyze bundle size
      run: npm run analyze
      
    - name: Upload bundle analysis
      uses: actions/upload-artifact@v4
      if: github.event_name == 'pull_request'
      with:
        name: bundle-analysis
        path: |
          dist/
          stats.json
        retention-days: 7
        
    - name: Comment PR with bundle changes
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Simple bundle size check
          if (fs.existsSync('dist')) {
            const stats = fs.statSync('dist');
            const sizeKB = Math.round(stats.size / 1024);
            
            const comment = `## 📊 Bundle Analysis
            
            - **Bundle Size**: ${sizeKB}KB
            - **Security Audit**: ✅ No vulnerabilities found
            - **TypeScript**: ✅ Compilation successful
            - **Linting**: ✅ No errors detected
            
            ---
            
            *This comment was automatically generated by the security workflow.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  security-monitoring:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Run comprehensive security scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        echo "Running comprehensive security scan..."
        npm audit --audit-level=low
        
        if [ -n "$SNYK_TOKEN" ]; then
          npm install -g snyk
          snyk auth $SNYK_TOKEN
          snyk test --severity-threshold=low
          snyk monitor
        fi
        
    - name: Generate security report
      run: |
        echo "# Security Report - $(date)" > security-report.md
        echo "" >> security-report.md
        echo "## Dependency Security" >> security-report.md
        echo "\`\`\`" >> security-report.md
        npm audit --json >> security-report.md
        echo "\`\`\`" >> security-report.md
        
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report-$(date +%Y%m%d)
        path: security-report.md
        retention-days: 30