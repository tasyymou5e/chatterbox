<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Font Preconnect (improves LCP by reducing connection latency) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Security Headers -->
    <!-- NOTE: 'unsafe-inline' and 'unsafe-eval' in script-src are required for Vite HMR
         and the Lovable preview environment. In a production deployment served via your own
         infrastructure, replace these with nonce-based CSP delivered through HTTP headers. -->
    <!-- NOTE: connect-src Supabase domain must be updated if the project ID changes (currently lxuqfgbukrrickanmmic) -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.gpteng.co https://*.lovable.app https://*.lovableproject.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' ws: wss: https://*.lovable.app https://*.lovableproject.com https://lxuqfgbukrrickanmmic.supabase.co wss://lxuqfgbukrrickanmmic.supabase.co https://api.x.ai https://fonts.googleapis.com https://fonts.gstatic.com;
      frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
      media-src 'self' https: blob:;
      worker-src 'self' blob:;
      manifest-src 'self';
    ">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Primary Meta Tags -->
    <title>Chatterbox - Empowering Children with Autism</title>
    <meta name="title" content="Chatterbox - Empowering Children with Autism">
    <meta name="description" content="Chatterbox empowers children with autism through technology, education, and family connection.">
    <meta name="author" content="Chatterbox Team">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chatterbox" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chatterbox.life/">
    <meta property="og:title" content="Chatterbox - Empowering Children with Autism">
    <meta property="og:description" content="Chatterbox empowers children with autism through technology, education, and family connection.">
    <meta property="og:image" content="https://chatterbox.life/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://chatterbox.life/">
    <meta property="twitter:title" content="Chatterbox - Empowering Children with Autism">
    <meta property="twitter:description" content="Chatterbox empowers children with autism through technology, education, and family connection.">
    <meta property="twitter:image" content="https://chatterbox.life/og-image.png">

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Chatterbox",
        "url": "https://chatterbox.life/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Chatterbox",
        "url": "https://chatterbox.life/",
        "logo": "https://chatterbox.life/android-chrome-512x512.png",
        "description": "Chatterbox empowers children with autism through educational games, communication tools, and family progress tracking."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
